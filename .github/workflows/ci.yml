name: CI

# Quality gate: runs on pull requests and on whatever lands in main.
# Deployment does not hang off this workflow — being manual, it can target any ref, so it
# replays the same checks itself (see deploy.yml).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request that gets several pushes only occupies one run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The MDT codec is the part we must not break unnoticed: a badly encoded string
      # would be rejected by the game.
      #
      # The two projects run as separate steps rather than as one `npm test`. Run together,
      # workerd starts in the middle of the jsdom suite and pumps its console through the same
      # main process that serves every worker's module transforms. Vitest gives a worker's
      # onTaskUpdate call sixty seconds to be answered — birpc's default, which 3.2.7 offers no
      # way to raise — and a main process busy on both projects at once has missed it, failing
      # the job with every test green. Apart, neither project competes with the other.
      # `relay.yml` already runs the relay on its own for the same reason.
      #
      # `dot` rather than the default reporter for the same reason: printing all 1362 test
      # names is main-thread work done between task updates, and that thread is the one that
      # has to answer them. A failure still prints in full, and `github-actions` puts it on
      # the diff as an annotation. The flags live here rather than in vite.config.ts so that
      # a local `npm test` keeps naming every test it ran.
      - name: Test the app
        run: npm test -- --project app --reporter=dot --reporter=github-actions

      # Thirteen tests, so the default reporter costs nothing and reads better.
      - name: Test the relay
        run: npm test -- --project relay

      # Building on pull requests too, to catch what the typecheck lets through.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    uses: ./.github/workflows/e2e.yml
