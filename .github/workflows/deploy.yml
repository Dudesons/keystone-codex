name: Déploiement

# Déclenchement manuel uniquement, par les mainteneurs du dépôt.
# L'interface Actions permet de choisir la branche ou le tag à publier.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nom du tag à poser (vide = vAAAA.MM.JJ-<numéro de run>)"
        required: false
        default: ''
      create_tag:
        description: 'Poser un tag sur le commit publié'
        type: boolean
        required: false
        default: true

permissions:
  contents: write # nécessaire pour poser le tag
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Vérification, build et tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : nécessaire pour savoir si le tag existe déjà.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Le déploiement étant manuel, il ne peut pas hériter de la garantie de la CI :
      # on revérifie ici, pour qu'aucune publication ne parte sur un build cassé.
      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Aucun script d'extraction n'est lancé : ils ont besoin d'une installation de WoW.
      # Les données et les assets sont versionnés, le build se suffit à lui-même.
      - name: Build
        run: npm run build

      - name: Poser un tag sur ce qui part en ligne
        id: tag
        if: inputs.create_tag
        run: |
          NAME="${{ inputs.tag }}"
          if [ -z "$NAME" ]; then
            NAME="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if git rev-parse "$NAME" >/dev/null 2>&1; then
            echo "Le tag $NAME existe déjà, on ne le recrée pas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NAME" -m "Déploiement $NAME"
          git push origin "$NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Récapitulatif
        run: |
          echo "### Déploiement effectué" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref : \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag : \`${{ needs.build.outputs.tag || 'aucun' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL : ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
