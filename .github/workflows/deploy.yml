name: Deploy

# Manual trigger only, by the repository maintainers.
# The Actions UI is where the branch or tag to publish gets picked.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create (empty = vYYYY.MM.DD-<run number>)'
        required: false
        default: ''
      create_tag:
        description: 'Tag the published commit'
        type: boolean
        required: false
        default: true

permissions:
  contents: write # required to push the tag
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Being manual, this cannot inherit CI's guarantee either, for the same reason the checks
  # below get replayed. Costs a second build of the app, to serve these tests, on top of
  # build's own — sharing a dist/ between the two jobs would couple them to save little.
  e2e:
    name: End-to-end
    uses: ./.github/workflows/e2e.yml

  build:
    name: Check, build and tag
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: required to tell whether the tag already exists.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Being manual, the deployment cannot inherit CI's guarantee: it re-checks here,
      # so that nothing ever ships on a broken build.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # No extraction script runs here: they need a WoW installation. The data and assets
      # are versioned, so the build stands on its own.
      - name: Build
        run: npm run build

      - name: Tag what goes online
        id: tag
        if: inputs.create_tag
        run: |
          NAME="${{ inputs.tag }}"
          if [ -z "$NAME" ]; then
            NAME="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if git rev-parse "$NAME" >/dev/null 2>&1; then
            echo "Tag $NAME already exists, leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NAME" -m "Deploy $NAME"
          git push origin "$NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ needs.build.outputs.tag || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
