name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de redéployer à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les push rapprochés annulent le précédent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Le codec MDT est la partie qu'on ne veut pas casser sans s'en apercevoir :
      # un échec ici empêche le déploiement.
      - name: Tests
        run: npm test

      # Aucun script d'extraction n'est lancé : ils ont besoin d'une installation de WoW.
      # Les données et les assets sont versionnés, le build se suffit à lui-même.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
