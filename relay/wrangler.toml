name = "keystone-relay"
main = "src/index.js"
# Two workerd builds are installed: the one bundled with wrangler, which `wrangler dev` and
# the README's local-relay recipe use, and an older one nested inside
# @cloudflare/vitest-pool-workers, which is what runs the tests. That older workerd supports
# no later date than this and falls back to it on every run. Pinning it here keeps the tests
# and production agreeing on one set of compatibility defaults, which is reason enough on its
# own. Raising it means upgrading @cloudflare/vitest-pool-workers, not wrangler.
compatibility_date = "2026-03-10"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed, which is the only storage the Workers free plan creates.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
